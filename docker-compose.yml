services:
  jiuzhuo:
    # 直接拉取 GitHub Actions 自动构建好的镜像，无需本地编译
    image: ghcr.io/maimengdexiaolaba/jiuzhuo-game:latest
    container_name: jiuzhuo-game
    restart: unless-stopped
    ports:
      - "9876:9876"
    environment:
      PORT: "9876"
      TZ: Asia/Shanghai
      # 内置管理员账号，首次启动时创建；请按需修改密码（改后需删除 data/ 目录重建）
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "admin"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9876/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
